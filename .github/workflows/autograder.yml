name: Autograder Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build test
        id: build-test
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Build
          command: python tests/run_tests.py --compile-only
          expected-output: Compilation succeeded.
          comparison-method: included
          timeout: 5
          max-score: 15

      - name: Dino statistics test
        id: dino-stats
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Dino Statistics
          command: python tests/run_tests.py --functional
          expected-output: All required statistics detected and validated.
          comparison-method: included
          timeout: 5
          max-score: 85

      - name: Autograding reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          BUILD-TEST_RESULTS: "${{ steps.build-test.outputs.result }}"
          DINO-STATS_RESULTS: "${{ steps.dino-stats.outputs.result }}"
        with:
          runners: build-test,dino-stats
